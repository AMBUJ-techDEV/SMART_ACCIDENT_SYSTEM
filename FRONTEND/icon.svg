<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Shield Crest -->
  <path d="M256 70 L390 125 C390 265, 335 375, 256 425 C177 375, 122 265, 122 125 Z" 
        fill="#ffffff" opacity="0.95" filter="url(#shadow)"/>
        
  <!-- Heart Symbol in Shield -->
  <path d="M256 340 C256 340, 340 280, 340 215 C340 180, 312 155, 280 155 C263 155, 256 166, 256 166 C256 166, 249 155, 232 155 C200 155, 172 180, 172 215 C172 280, 256 340, 256 340 Z" 
        fill="#ef4444"/>
        
  <!-- Medical Cross / SOS Spark in Heart -->
  <rect x="246" y="200" width="20" height="60" rx="6" fill="#ffffff"/>
  <rect x="226" y="220" width="60" height="20" rx="6" fill="#ffffff"/>
  
  <!-- Pulse Line Accent -->
  <path d="M150 250 L200 250 L220 220 L240 280 L260 210 L280 270 L300 250 L362 250" 
        fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>
